<style>
:root{--t0:#1c7ed6;--t1:#e03131;--t0i:#fff;--t1i:#fff;--bg:#070b18;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--txt:#f4f6fb;--muted:#a3acc2;--gold:#ffc83d;--orange:#ff7a1a;--court:clamp(160px,26vh,270px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg)}
body{font-family:Rubik,system-ui,sans-serif;color:var(--txt);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}
.f0{fill:var(--t0)}.f1{fill:var(--t1)}

/* ---------- app shell ---------- */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;background:
 radial-gradient(ellipse 55% 55% at 80% -15%,color-mix(in srgb,var(--t0) 38%,transparent),transparent 70%),
 radial-gradient(ellipse 55% 55% at 20% -15%,color-mix(in srgb,var(--t1) 38%,transparent),transparent 70%),
 linear-gradient(#0d1430,#070b18 70%)}
.top{display:flex;align-items:center;gap:12px;padding:8px 16px 4px;flex:none}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:36px;height:36px;flex:none}
.logo h1{margin:0;font-family:'Secular One';font-weight:400;font-size:clamp(20px,2.3vw,32px);line-height:1;background:linear-gradient(180deg,#fff 30%,#ffc98a);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.bday{font-weight:800;font-size:clamp(11px,1vw,14px);padding:5px 12px;border-radius:999px;background:linear-gradient(90deg,#ff3d77,#ffb020);color:#2a0a00;white-space:nowrap}
.tools{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.ib{height:36px;min-width:36px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700}
.ib:hover{background:rgba(255,255,255,.14)}
.ib.on{background:rgba(255,122,26,.25);border-color:var(--orange)}
.conn{font-size:13px;font-weight:700;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--muted);white-space:nowrap}
.conn.on{background:rgba(47,210,122,.18);color:#7dffb4}
.stage{flex:1;min-height:0;overflow:auto;padding:4px 16px 10px;display:flex;justify-content:center}
.view{width:min(1320px,100%);display:none;flex-direction:column;gap:12px}
.view.on{display:flex}

/* ---------- setup ---------- */
.hero{text-align:center}
.hero .k{color:var(--muted);font-weight:700;letter-spacing:1px}
.hero .t{font-family:'Secular One';font-size:clamp(34px,5vw,64px);line-height:1.05;background:linear-gradient(180deg,#fff,#ffb35c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(255,122,26,.35))}
.hero .s{font-size:clamp(15px,1.6vw,20px);font-weight:700}
.teams-setup{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.vs{font-family:Bungee;font-size:clamp(28px,3.5vw,48px);color:var(--gold);text-shadow:0 0 20px rgba(255,200,61,.5)}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;border-top:6px solid var(--c);display:flex;flex-direction:column;gap:10px}
.tcard .h{font-weight:800;color:var(--muted);font-size:14px}
.tname{width:100%;font-size:24px;font-weight:800;padding:9px 14px;border-radius:12px;border:2px solid var(--line);background:rgba(0,0,0,.25);color:#fff;outline:none}
.tname:focus{border-color:var(--c)}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid rgba(255,255,255,.25);background:var(--s);position:relative;padding:0}
.sw.on{border-color:#fff;box-shadow:0 0 0 3px var(--s)}
.sw.custom{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);overflow:hidden;cursor:pointer}
.sw.custom input{position:absolute;inset:-4px;opacity:0;width:140%;height:140%;cursor:pointer}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px}
.fld{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--muted)}
.fld input{background:rgba(0,0,0,.25);border:1px solid var(--line);color:#fff;border-radius:10px;padding:8px 10px;font-size:16px;font-weight:700;width:130px}
.big{font-family:'Secular One';font-size:clamp(20px,2vw,28px);padding:12px 32px;border-radius:999px;border:0;color:#2a0f00;background:linear-gradient(180deg,#ffb35c,#ff7a1a);box-shadow:0 8px 30px rgba(255,122,26,.45),inset 0 -4px 0 rgba(0,0,0,.18)}
.big:hover{filter:brightness(1.08)}
.ghost{font-weight:800;font-size:15px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:#fff}
.phone-tip{font-size:14px;color:var(--muted);text-align:center;line-height:1.6}
.phone-tip b{color:#fff}

/* ---------- board ---------- */
.turnbar{display:flex;justify-content:center;min-height:42px}
.tchip{display:inline-flex;align-items:center;gap:8px;padding:7px 20px;border-radius:999px;font-weight:800;font-size:clamp(16px,1.6vw,22px);background:var(--tc);color:var(--tci);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 18px color-mix(in srgb,var(--tc) 60%,transparent)}50%{box-shadow:0 0 44px color-mix(in srgb,var(--tc) 95%,transparent)}}
.board{display:grid;grid-template-columns:repeat(7,1fr) 1.2fr 1.05fr;gap:clamp(5px,.7vw,10px)}
.bh{border-radius:14px;padding:6px 4px;text-align:center;font-weight:800;font-size:clamp(11px,1.1vw,16px);line-height:1.15;background:linear-gradient(180deg,#24305e,#18203f);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px}
.bh .ic{font-size:clamp(18px,2vw,28px)}
.bh.m{background:linear-gradient(180deg,#5b3a00,#3a2400);border-color:rgba(255,200,61,.5);color:var(--gold)}
.cell{border:0;border-radius:14px;min-height:clamp(58px,9.5vh,110px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;background:linear-gradient(180deg,#2b6cff,#1840b8);box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),0 6px 16px rgba(0,0,0,.3);transition:transform .15s;position:relative;padding:4px}
.cell[data-l="1"]{background:linear-gradient(180deg,#8b4dff,#5a23c8)}
.cell[data-l="2"]{background:linear-gradient(180deg,#ff5a5a,#c81e3c)}
.cell.ms{background:linear-gradient(180deg,#ffc83d,#e08a00);color:#2a1600}
.cell.tk{background:linear-gradient(180deg,#3ee08a,#12925a);color:#04210f}
.bh.t{background:linear-gradient(180deg,#0f4d33,#08321f);border-color:rgba(47,210,122,.5);color:#7dffb4}
button.cell:hover{transform:translateY(-3px) scale(1.03)}
.cell .p{font-family:Bungee;font-size:clamp(22px,2.6vw,40px);line-height:1}
.cell .l{font-size:clamp(11px,1vw,14px);font-weight:700;opacity:.85}
.cell.ms .p{font-size:clamp(14px,1.5vw,22px);font-family:'Secular One'}
.cell .ty{position:absolute;top:4px;inset-inline-start:6px;font-size:clamp(12px,1.1vw,16px)}
.cell.locked{filter:grayscale(.85) brightness(.55)}
.cell .lk{position:absolute;top:4px;inset-inline-end:6px;font-size:clamp(14px,1.3vw,20px)}
.sbl{display:flex;gap:3px;justify-content:center;margin:1px 0}.sbl i{font-style:normal;font-size:10px;font-weight:800;padding:0 4px;border-radius:5px;background:rgba(47,210,122,.25);color:#9dffc4}.sbl i.no{background:rgba(255,255,255,.07)}
.cell.used{background:rgba(255,255,255,.04)!important;box-shadow:none;color:rgba(255,255,255,.45);border:2px solid color-mix(in srgb,var(--uc) 70%,transparent)}
.cell.used .p{font-size:clamp(15px,1.4vw,22px);font-family:Rubik;font-weight:900;color:var(--uc)}
.cell.used .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* ---------- question ---------- */
#v-question{align-items:center;justify-content:center}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{padding:6px 14px;border-radius:999px;font-weight:800;background:var(--card);border:1px solid var(--line);font-size:clamp(13px,1.25vw,18px)}
.chip.val{background:linear-gradient(90deg,#ffb35c,#ff7a1a);color:#2a0f00;border:0}
.chip.fire{background:#ff3d00;border:0}
.chip.hint{background:#ffe066;color:#3a2a00;border:0}
.qcard{width:min(1150px,100%);background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border:1px solid var(--line);border-radius:28px;padding:clamp(16px,2.6vw,38px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:popin .45s}
.qwho{font-weight:800;font-size:clamp(15px,1.5vw,22px);margin-bottom:10px;display:inline-block;padding:5px 16px;border-radius:999px;background:color-mix(in srgb,var(--tc,#ff7a1a) 30%,transparent);border:2px solid var(--tc,#ff7a1a)}
.qtext{font-family:'Secular One';font-size:clamp(24px,3.4vw,52px);line-height:1.25}
.hintbox{margin-top:16px;display:inline-block;padding:10px 18px;border-radius:16px;background:#ffe066;color:#3a2a00;font-weight:800;font-size:clamp(16px,1.8vw,26px);animation:popin .5s}
.hintbox::before{content:'💡 ';}
.opt{display:inline-block;margin:3px;padding:5px 14px;border-radius:10px;background:rgba(0,0,0,.12)}
.quote{font-family:'Secular One';font-size:clamp(22px,2.8vw,42px);line-height:1.35}
.quote::before{content:'❝';display:block;font-size:1.6em;color:var(--gold);line-height:.8}
.wa{display:flex;gap:18px;align-items:flex-start;margin-top:6px;text-align:start}
.meter{flex:none;width:clamp(90px,10vw,140px);aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#3a2a00,#1a1300);border:4px solid var(--gold);box-shadow:0 0 30px rgba(255,200,61,.4)}
.meter b{font-family:Bungee;font-size:clamp(34px,4vw,56px);color:var(--gold);line-height:1}
.meter small{font-weight:800;color:var(--gold)}
.clues{flex:1;list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:7px}
.clues li{padding:7px 12px;border-radius:12px;background:rgba(255,255,255,.07);font-weight:700;font-size:clamp(13px,1.3vw,19px);display:flex;gap:10px;align-items:center}
.clues li .n{font-family:Bungee;color:var(--gold);min-width:1.6em}
.clues li.new{background:rgba(255,200,61,.24);animation:popin .5s;outline:2px solid var(--gold)}
.clues li.hid{opacity:.28}
.locks{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.lock{padding:6px 16px;border-radius:999px;font-weight:800;background:var(--lc);color:var(--lci)}
.lock.off{opacity:.35;text-decoration:line-through}
.rfg{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
.rfc{position:relative;padding:14px 8px;border-radius:14px;background:rgba(255,255,255,.08);border:2px solid var(--line);font-weight:900;font-size:clamp(15px,1.7vw,24px);display:flex;flex-direction:column;align-items:center;gap:4px}
.rfo{font-size:.62em;font-weight:600;color:#cdd3e6;line-height:1.3;text-align:center}
.rft{display:none;font-size:.7em}
.rfd{display:flex;gap:4px;min-height:12px}.rfd i{width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.6)}
.rfg.rev .rfc{animation:rflip .5s both;animation-delay:var(--dl)}
.rfg.rev .rfc.real{animation-name:rreal}.rfg.rev .rfc .rft{display:block}
.rfg.rev .rfc.fake{animation-name:rfake}
@keyframes rreal{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:none;opacity:.55;border-color:#2fd27a;background:rgba(47,210,122,.12)}}
@keyframes rfake{0%{transform:scale(1)}40%{transform:scale(1.25) rotate(-4deg)}100%{transform:scale(1.08);background:#c92a2a;border-color:#ff6b6b;box-shadow:0 0 30px #ff6b6b}}
.rfg.rev .rfc .rft{opacity:0;animation:rshow .2s forwards;animation-delay:calc(var(--dl) + .25s)}
@keyframes rshow{to{opacity:1}}
.pair{display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,40px);margin-top:12px}
.tm{width:clamp(170px,25vw,330px);aspect-ratio:1.5;border-radius:22px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:'Secular One';font-size:clamp(20px,2.4vw,36px);padding:12px;background:var(--tmc,#333);color:#fff;box-shadow:inset 0 -8px 0 rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.4);text-shadow:0 2px 6px rgba(0,0,0,.5);border:3px solid rgba(255,255,255,.3)}
.tm.spin{animation:spinf .12s linear infinite}
.ltbox{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:14px;font-weight:800;font-size:clamp(16px,1.7vw,24px)}
.ltt{font-family:Bungee;font-size:clamp(34px,4vw,60px);color:#fff;padding:2px 18px;border-radius:16px;background:var(--tc);box-shadow:0 0 30px var(--tc)}
.tm.lt{width:clamp(150px,18vw,240px);aspect-ratio:1;font-size:clamp(90px,12vw,170px);--tmc:linear-gradient(180deg,#ff8a00,#e52e00);background:linear-gradient(180deg,#ff9a2a,#d93d00);line-height:1}
@keyframes spinf{50%{transform:translateY(-6px) scale(.97)}}
.plus{font-family:Bungee;font-size:clamp(30px,4vw,60px);color:var(--gold)}
.pp{display:flex;align-items:center;justify-content:center;gap:clamp(12px,2vw,26px);margin-top:18px}
.ppt{padding:12px 22px;border-radius:16px;font-weight:900;font-size:clamp(18px,2vw,28px);background:color-mix(in srgb,var(--tc) 25%,transparent);border:3px solid var(--tc);opacity:.5;transition:.3s}
.ppt.on{opacity:1;background:var(--tc);color:var(--tci);transform:scale(1.1);box-shadow:0 0 30px var(--tc)}
.ppb{display:flex;flex-direction:column;align-items:center;min-width:110px}
.ppball{font-size:40px;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.ppball.r{transform:translateX(40px) rotate(-20deg)}.ppball.l{transform:translateX(-40px) rotate(20deg)}
.ppn{font-family:Bungee;font-size:36px;color:var(--gold);line-height:1}
.ppb small{color:var(--muted);font-weight:700}
.ppw{margin-top:14px;font-weight:900;color:#ffe066;font-size:clamp(16px,1.8vw,24px)}
.hl{display:flex;gap:16px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.hlbox{min-width:170px;padding:12px 20px;border-radius:18px;border:3px solid var(--tc);background:color-mix(in srgb,var(--tc) 22%,transparent)}
.hlbox small{display:block;font-weight:800;color:#dfe4f3;font-size:clamp(13px,1.2vw,17px)}
.hlbox b{font-family:Bungee;font-size:clamp(30px,4vw,56px);line-height:1.2}
.hlbox.rev{--tc:#ffc83d;animation:popin .5s}
@keyframes popin{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05)}100%{transform:none;opacity:1}}

/* ---------- host bar ---------- */
.hostbar{flex:none;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:7px 12px;background:rgba(5,8,18,.8);border-top:1px solid var(--line)}
.hb-l{font-weight:800;color:var(--muted)}
.hb-tip{color:var(--muted);font-weight:700}
.cb{font-family:Rubik;font-weight:800;font-size:15px;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:#26305a;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.2}
.cb:disabled{opacity:.35;cursor:default}
.cb.ok{background:#1f9d55;border-color:#2fd27a}
.cb.no{background:#c92a2a;border-color:#ff6b6b}
.cb.hint{background:#f2b705;color:#2a1a00;border-color:#ffe066}
.cb.fire{background:linear-gradient(180deg,#ff8a00,#e52e00);border:0}
.cb.go{background:linear-gradient(180deg,#ffb35c,#ff7a1a);color:#2a0f00;border:0}
.cb.sm{font-size:13px;padding:7px 11px;background:rgba(255,255,255,.08)}
.cb.tsel.on{outline:3px solid #fff;background:#3b4a8a}
.cb.sent{animation:sent .5s}
@keyframes sent{50%{transform:scale(.93);filter:brightness(1.4)}}
.trow{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:12px;background:rgba(255,255,255,.05);border-inline-start:6px solid var(--tc)}
.trow .tn{font-weight:800;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hlin{width:160px;font-size:20px;font-weight:800;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:rgba(0,0,0,.3);color:#fff}
.cl{font-weight:800}

/* ---------- court ---------- */
.court{flex:none;height:var(--court);position:relative;display:flex;align-items:stretch;overflow:hidden;border-top:2px solid rgba(255,255,255,.12)}
.floor{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 35%),repeating-linear-gradient(90deg,#cf8f4f 0 58px,#b97a3e 58px 60px,#d69a5a 60px 118px,#b4763a 118px 120px);box-shadow:inset 0 14px 24px rgba(0,0,0,.35)}
.floor::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:rgba(255,255,255,.8)}
.floor::after{content:'';position:absolute;left:50%;top:50%;width:min(22vw,220px);height:62%;border:4px solid rgba(255,255,255,.8);border-radius:50%;transform:translate(-50%,-50%)}
.paint{position:absolute;top:0;bottom:0;width:15%;opacity:.55}
.paint.p0{right:0;background:var(--t0);clip-path:polygon(0 0,100% 0,100% 100%,18% 100%)}
.paint.p1{left:0;background:var(--t1);clip-path:polygon(0 0,100% 0,82% 100%,0 100%)}
.half{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1}
.half[data-t="0"]{--tc:var(--t0);--tci:var(--t0i)}.half[data-t="1"]{--tc:var(--t1);--tci:var(--t1i)}
.half::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 75% at 50% 100%,color-mix(in srgb,var(--tc) 50%,transparent),transparent 70%);opacity:0;transition:.4s}
.half.active::before{opacity:1}
.pennant{margin-top:6px;padding:4px 22px 5px;font-family:'Secular One';font-size:clamp(15px,1.7vw,25px);background:var(--tc);color:var(--tci);border-radius:10px;box-shadow:0 4px 0 rgba(0,0,0,.25);position:relative;z-index:2;max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.half.active .pennant{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.lineup{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2%;position:relative}
.player{height:calc(var(--h)*94%);margin-inline:-1.6%;transform-origin:50% 100%}
.player svg{height:100%;width:auto;display:block;overflow:visible}
.arms-up{display:none}.up .arms-up{display:inline}.up .arms-down{display:none}
.half.active .player{animation:bob 1.2s ease-in-out infinite;animation-delay:var(--d)}
.half.active .ball{animation:drib .5s ease-in infinite alternate}
@keyframes drib{to{transform:translateY(60px)}}
@keyframes bob{50%{transform:translateY(-3px)}}
.half.jump .player,.half.celebrate .player{animation:jump .95s cubic-bezier(.3,.7,.4,1) both;animation-delay:var(--d)}
.half.celebrate .player{animation-iteration-count:infinite}
@keyframes jump{0%{transform:none}12%{transform:scaleY(.9)}42%{transform:translateY(-30%)}72%{transform:scaleY(.94)}86%{transform:translateY(-6%)}100%{transform:none}}
.center{flex:none;width:clamp(170px,19vw,280px);display:flex;align-items:center;justify-content:center;z-index:2;padding-bottom:4%}
.sb{display:flex;align-items:stretch;background:#0a0e1c;border:3px solid #2b3560;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.6);overflow:hidden;width:100%}
.sbt{flex:1;min-width:0;padding:5px 4px 7px;text-align:center;border-top:5px solid var(--tc);position:relative}
.sbn{font-size:clamp(11px,1vw,14px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#cdd3e6}
.sbv{font-family:Bungee;font-size:clamp(28px,3.4vw,52px);color:#ffcf4a;text-shadow:0 0 14px rgba(255,180,0,.6);line-height:1.05}
.sbv.pop{animation:pop .8s}
@keyframes pop{30%{transform:scale(1.5);color:#fff}}
.sbd{font-size:11px;font-weight:800}
.sbd.used{opacity:.25;text-decoration:line-through}
.sbm{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 6px;font-family:Bungee;color:#8c96b8;font-size:clamp(14px,1.4vw,20px);border-inline:2px solid #1d2648}
.sbm small{font-family:Rubik;font-size:10px;font-weight:700}
.adj{position:absolute;top:2px;inset-inline-end:2px;display:none;flex-direction:column;gap:2px}
.sbt:hover .adj{display:flex}
.adj button{width:20px;height:17px;font-size:12px;line-height:1;padding:0;border:0;border-radius:4px;background:#2b3560;color:#fff}

/* ---------- scene ---------- */
.scene{position:fixed;inset:0;z-index:50;display:none;background:#070b18;overflow:hidden}
.scene.on{display:block}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.scene.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(-14px,7px)}40%{transform:translate(12px,-9px)}60%{transform:translate(-9px,5px)}80%{transform:translate(6px,-3px)}}
.scap{position:absolute;top:4%;left:0;right:0;text-align:center;pointer-events:none}
.scap .c1{font-family:'Secular One';font-size:clamp(46px,8.5vw,136px);line-height:1;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.35),0 0 40px var(--cc,#ff7a1a);transform:scale(0)}
.scap .c1.show{animation:capin .7s cubic-bezier(.2,1.6,.4,1) forwards}
.scap .c2{font-family:'Secular One';font-size:clamp(22px,3.2vw,50px);color:var(--cc,#fff);margin-top:6px;opacity:0;text-shadow:0 3px 0 rgba(0,0,0,.5)}
.scap .c2.show{animation:fadeup .5s .2s forwards}
@keyframes capin{from{transform:scale(0) rotate(-8deg)}to{transform:scale(1) rotate(0)}}
@keyframes fadeup{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.sans{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);background:rgba(7,11,24,.9);border:3px solid var(--gold);border-radius:20px;padding:12px 28px;font-size:clamp(18px,2.4vw,36px);font-weight:900;text-align:center;opacity:0;max-width:86vw}
.sans.show{animation:fadeup2 .5s forwards}
@keyframes fadeup2{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
.sans small{display:block;font-size:.5em;color:var(--gold);font-weight:800}
.scene.quick .sback{display:none}
#dblOv{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(3,6,15,.93)}
.sback{position:absolute;bottom:18px;left:18px;font-size:18px!important;padding:12px 20px!important}
.fan{transition:transform .4s}
.cheer .fan{animation:fan .3s ease-in-out infinite alternate;animation-delay:var(--dl)}
@keyframes fan{to{transform:translateY(-18px)}}
.farms{opacity:0;transition:opacity .2s}
.cheer .farms{opacity:1}
.groan .fan{transform:translateY(9px)}
.led{animation:led 16s linear infinite}
@keyframes led{from{transform:translateX(950px)}to{transform:translateX(-950px)}}
#sc-net.swish{animation:swish .5s ease-out;transform-box:view-box;transform-origin:262px 333px}
@keyframes swish{30%{transform:scaleY(1.35) scaleX(.85)}100%{transform:none}}
.bend{animation:bend .7s;transform-box:view-box;transform-origin:207px 330px}
@keyframes bend{25%{transform:rotate(14deg)}60%{transform:rotate(-4deg)}100%{transform:none}}
.wob{animation:wob .5s;transform-box:view-box;transform-origin:207px 330px}
@keyframes wob{25%{transform:rotate(-4deg)}60%{transform:rotate(3deg)}}
.bshake{animation:bshake .45s;transform-box:view-box;transform-origin:195px 270px}
@keyframes bshake{20%{transform:translateX(-9px) rotate(-2deg)}50%{transform:translateX(7px) rotate(2deg)}80%{transform:translateX(-3px)}}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(3,6,15,.8);backdrop-filter:blur(6px);padding:16px}
.ov.on{display:flex}
.ovc{background:linear-gradient(180deg,#1b2552,#0e1430);border:1px solid var(--line);border-radius:26px;padding:clamp(18px,3vw,34px);width:min(720px,96vw);text-align:center;max-height:92vh;overflow:auto;animation:popin .4s}
.ovt{font-family:'Secular One';font-size:clamp(28px,3.4vw,48px);line-height:1.15}

.ed{width:min(1000px,96vw);text-align:start}

#toast{position:fixed;top:12px;left:50%;transform:translate(-50%,-160%);z-index:80;background:var(--tc,#ff7a1a);padding:12px 24px;border-radius:16px;font-weight:900;font-size:clamp(16px,2vw,28px);box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,1.4,.4,1);max-width:92vw;text-align:center;pointer-events:none}

<script>
'use strict';
/* ================= utils ================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const rnd=n=>Math.floor(Math.random()*n);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmt=v=>Number.isInteger(v)?String(v):(Math.round(v*10)/10).toString();
const store={get(k,d){try{const v=localStorage.getItem('nbabig1.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('nbabig1.'+k,JSON.stringify(v))}catch(e){}}};
function rgb(h){h=String(h||'#888').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16)||0;return[n>>16&255,n>>8&255,n&255]}
function hex(r,g,b){return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function mix(a,b,t){const A=rgb(a),B=rgb(b);return hex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t)}
function lum(h){const c=rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
const ink=h=>lum(h)>.4?'#10131f':'#ffffff';
const trimOf=h=>lum(h)<.05?mix(h,'#ffffff',.45):mix(h,'#000000',.35);
const okHex=h=>typeof h==='string'&&/^#[0-9a-f]{6}$/i.test(h);

/* ================= audio ================= */
let AC=null,muted=store.get('muted',false),NB=null,OUT=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function nbuf(a){if(!NB){const len=a.sampleRate*2;NB=a.createBuffer(1,len,a.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1}return NB}
function out(a){if(!OUT){OUT=a.createGain();OUT.gain.value=.9;const comp=a.createDynamicsCompressor();OUT.connect(comp);comp.connect(a.destination)}return OUT}
function tone(f,at,dur,o={}){const a=ac();if(!a||muted)return;const{type='triangle',vol=.15,to=null,vib=0,perc=0}=o;const t=a.currentTime+at,osc=a.createOscillator(),g=a.createGain();osc.type=type;osc.frequency.setValueAtTime(f,t);if(to)osc.frequency.exponentialRampToValueAtTime(to,t+dur);
 if(vib){const l=a.createOscillator(),lg=a.createGain();l.frequency.value=6;lg.gain.value=vib;l.connect(lg);lg.connect(osc.frequency);l.start(t);l.stop(t+dur+.1)}
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);if(!perc)g.gain.setValueAtTime(vol,t+Math.max(.02,dur-.08));g.gain.exponentialRampToValueAtTime(.0001,t+dur);osc.connect(g);g.connect(out(a));osc.start(t);osc.stop(t+dur+.05)}
function noise(at,dur,o={}){const a=ac();if(!a||muted)return;const{type='bandpass',f=1000,q=1,vol=.2,att=.01}=o;const t=a.currentTime+at,s=a.createBufferSource();s.buffer=nbuf(a);s.loop=true;const fl=a.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl);fl.connect(g);g.connect(out(a));s.start(t,Math.random());s.stop(t+dur+.05)}
const SFX={
 pick(){tone(660,0,.09,{vol:.12,perc:1});tone(990,.08,.14,{vol:.12,perc:1})},
 reveal(){[392,523,659].forEach((f,i)=>tone(f,i*.07,.3,{type:'square',vol:.05,perc:1}))},
 tick(){tone(1400,0,.03,{type:'square',vol:.04,perc:1})},
 hint(){tone(1318,0,.25,{type:'sine',vol:.12,perc:1});tone(1760,.1,.4,{type:'sine',vol:.1,perc:1})},
 clue(){tone(880,0,.12,{type:'sine',vol:.12,perc:1});tone(1175,.06,.2,{type:'sine',vol:.1,perc:1})},
 fire(){noise(0,.8,{f:1200,q:.7,vol:.22,att:.2});[392,523,659].forEach((f,i)=>tone(f,.25+i*.09,.3,{type:'square',vol:.05,perc:1}))},
 ping(){tone(1200,0,.08,{type:'sine',vol:.16,perc:1});tone(1600,.05,.12,{type:'sine',vol:.1,perc:1});this.cheer(1.2,.5)},
 wrongSmall(){tone(165,0,.3,{type:'square',vol:.07});this.groan(.7)},
 lock(){tone(130,0,.5,{type:'square',vol:.1});this.groan(.7)},
 swish(){noise(0,.35,{type:'highpass',f:2800,q:.4,vol:.3,att:.04})},
 bounce(v=.6){tone(140,0,.14,{type:'sine',vol:.35*v,to:55,perc:1});noise(0,.05,{type:'lowpass',f:500,vol:.2*v,att:.002})},
 squeak(){tone(2300,0,.07,{type:'sine',vol:.05,to:2900,perc:1});tone(2500,.09,.06,{type:'sine',vol:.05,to:3100,perc:1})},
 clang(v=1){[523,1307,2213,3047].forEach((f,i)=>tone(f,0,.9-i*.15,{type:'sine',vol:.07*v,perc:1}))},
 thud(){tone(85,0,.35,{type:'sine',vol:.45,to:45,perc:1});noise(0,.18,{type:'lowpass',f:700,vol:.35,att:.003});this.clang(.6)},
 dunk(){tone(70,0,.7,{type:'sine',vol:.55,to:35,perc:1});noise(0,.45,{type:'lowpass',f:400,vol:.45,att:.003});this.clang(.9)},
 bonk(){tone(520,0,.18,{type:'sine',vol:.28,to:300,perc:1});tone(260,.02,.18,{type:'triangle',vol:.15,perc:1});tone(350,.02,.25,{type:'square',vol:.05,to:120,perc:1})},
 block(){tone(180,0,.22,{type:'square',vol:.12,to:90,perc:1});noise(0,.14,{type:'lowpass',f:1400,vol:.45,att:.003});this.cheer(1.4,.6)},
 whoosh(){noise(0,.7,{f:600,q:3,vol:.15,att:.25})},
 horn(){[233,294,349].forEach(f=>tone(f,0,1.2,{type:'sawtooth',vol:.06}))},
 drum(d=2){for(let t=0;t<d;t+=.05)noise(t,.05,{type:'bandpass',f:180,q:1,vol:.06+.14*(t/d),att:.003});noise(d,.6,{type:'lowpass',f:300,vol:.4,att:.003});tone(523,d,.5,{vol:.1,perc:1})},
 cheer(len=3,v=1){const a=ac();if(!a||muted)return;const t=a.currentTime;const s=a.createBufferSource();s.buffer=nbuf(a);s.loop=true;const f1=a.createBiquadFilter();f1.type='bandpass';f1.frequency.value=950;f1.Q.value=.5;const f2=a.createBiquadFilter();f2.type='peaking';f2.frequency.value=2500;f2.gain.value=6;const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3*v,t+.3);g.gain.setValueAtTime(.28*v,t+len*.55);g.gain.exponentialRampToValueAtTime(.0001,t+len);
  const l=a.createOscillator(),lg=a.createGain();l.frequency.value=3.3;lg.gain.value=.05*v;l.connect(lg);lg.connect(g.gain);s.connect(f1);f1.connect(f2);f2.connect(g);g.connect(out(a));s.start(t);s.stop(t+len+.1);l.start(t);l.stop(t+len);
  for(let i=0;i<len*26*v;i++)noise(Math.random()*len*.85,.04,{type:'highpass',f:1400,q:.7,vol:(.04+Math.random()*.08)*v,att:.002});
  noise(0,len*.9,{type:'lowpass',f:450,q:.5,vol:.12*v,att:.25})},
 groan(v=1){noise(0,1.5,{f:420,q:.8,vol:.2*v,att:.15});noise(0,1.3,{type:'lowpass',f:300,vol:.14*v,att:.12})},
 trombone(at=.3){let tt=at;[[392,.36],[370,.36],[349,.36],[330,1.1]].forEach(([f,d],i)=>{tone(f,tt,d,{type:'triangle',vol:.12});tt+=d+.04})},
 win(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.14,i===5?.8:.18,{type:'square',vol:.06}));this.cheer(4.5)}
};

/* ================= confetti ================= */
const cv=$('#fx'),cx=cv.getContext('2d');let PARTS=[],craf=0;
function fit(){const d=window.devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}addEventListener('resize',fit);fit();
function burst(colors,n=120,x=innerWidth/2,y=innerHeight*.4){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=4+Math.random()*11;PARTS.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-7,s:6+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:colors[i%colors.length],l:120+Math.random()*60,sh:Math.random()<.3})}if(!craf)craf=requestAnimationFrame(stepFx)}
function stepFx(){cx.clearRect(0,0,innerWidth,innerHeight);PARTS=PARTS.filter(p=>p.l-->0&&p.y<innerHeight+40);for(const p of PARTS){p.vy+=.3;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.l/40);cx.fillStyle=p.c;if(p.sh){cx.beginPath();cx.arc(0,0,p.s/2,0,7);cx.fill()}else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()}craf=PARTS.length?requestAnimationFrame(stepFx):0;if(!craf)cx.clearRect(0,0,innerWidth,innerHeight)}

 return o}

let runId=0,sceneKey=null;
const E={lin:t=>t,out:t=>1-(1-t)*(1-t),in:t=>t*t};
let SPD=1,quickLive=false;
function tw(ms,fn,ease=E.lin){ms*=SPD;const my=runId;return new Promise(res=>{const t0=performance.now();const f=n=>{if(my!==runId)return res(false);const t=Math.min(1,(n-t0)/ms);fn(ease(t));if(t<1)requestAnimationFrame(f);else res(true)};requestAnimationFrame(f)})}
const P={x:1300,lift:0,rot:0},BL={x:-200,y:-200,r:0};
function setP(){$('#sc-player').setAttribute('transform',`translate(${(P.x-90).toFixed(1)} ${(441-P.lift).toFixed(1)}) scale(1.8) rotate(${P.rot.toFixed(1)} 50 194)`)}
function setB(){$('#sc-ball').setAttribute('transform',`translate(${BL.x.toFixed(1)} ${BL.y.toFixed(1)}) rotate(${(BL.r%360).toFixed(0)})`)}
function pose(p){$('#sc-player').classList.toggle('up',p==='up')}
const D={x:900,lift:0,rot:0};
function setD(){$('#sc-def').setAttribute('transform',`translate(${(D.x-90).toFixed(1)} ${(441-D.lift).toFixed(1)}) scale(1.8) rotate(${D.rot.toFixed(1)} 50 194)`)}
function poseD(p){$('#sc-def').classList.toggle('up',p==='up')}
async function defJump(h,ms,delay=0){if(delay)await sleep(delay*SPD);poseD('up');await tw(ms,t=>{D.lift=h*Math.sin(Math.PI*t);setD()});D.lift=0;setD();poseD('down')}
function defMove(x1,ms){const x0=D.x;return tw(ms,t=>{D.x=x0+(x1-x0)*t;setD()})}
function defStagger(dx,ms){const x0=D.x;poseD('up');return tw(ms,t=>{D.x=x0+dx*(1-(1-t)*(1-t));D.rot=Math.sign(dx)*7*Math.sin(Math.PI*t);D.lift=5*Math.abs(Math.sin(Math.PI*t*3));setD()}).then(()=>{D.rot=0;D.lift=0;setD()})}
const hand=()=>({x:P.x+74,y:671-P.lift}),head=()=>({x:P.x,y:430-P.lift});
function dribble(ms,x0,x1,n){const my=runId;for(let k=0;k<n;k++)setTimeout(()=>{if(my===runId)SFX.bounce(.45)},ms*SPD*(k+.5)/n);return tw(ms,t=>{P.x=x0+(x1-x0)*t;setP();const h=hand();BL.x=h.x;BL.y=h.y+(766-h.y)*Math.abs(Math.sin(Math.PI*t*n));BL.r-=x1===x0?5:10;setB()})}
function arc(x1,y1,peak,ms,spin=-9){const x0=BL.x,y0=BL.y,h=Math.max(0,Math.min(y0,y1)-peak);return tw(ms,t=>{BL.x=x0+(x1-x0)*t;BL.y=y0+(y1-y0)*t-h*4*t*(1-t);BL.r+=spin;setB()})}
function jumpWithBall(h,ms){return tw(ms,t=>{P.lift=h*Math.sin(Math.PI/2*t);setP();const p=head();BL.x=p.x;BL.y=p.y;setB()})}
function land(from,ms=420){return tw(ms,t=>{P.lift=from*(1-t);setP()},E.in).then(()=>pose('down'))}
function cls(sel,c,ms=800){const e=$(sel);if(!e)return;e.classList.remove(c);void e.getBoundingClientRect();e.classList.add(c);setTimeout(()=>e.classList.remove(c),ms)}
function netSwish(){cls('#sc-net','swish',600)}

async function through(){SFX.swish();netSwish();await tw(240,t=>{BL.x=262;BL.y=318+110*t;setB()},E.in);floorRoll(262)}
async function mkLayup(){P.x=1350;setP();pose('down');D.x=760;setD();(async()=>{await sleep(250*SPD);SFX.squeak();await defStagger(-290,850);defJump(80,480)})();await dribble(1000,1350,560,4);pose('up');SFX.squeak();
 await tw(380,t=>{P.x=560-170*t;P.lift=170*Math.sin(Math.PI/2*t);setP();const h=head();BL.x=h.x;BL.y=h.y;setB()});

 if(c.l===2&&c.c===G.aiFav&&!late)return Math.random()<smart*.9?"fav":false;
 if(late&&lead<0&&(c.l===2||(c.l===1&&left<=3)))return Math.random()<Math.min(1,.35+smart)?"behind":false;
 if(late&&lead>=0)return left<=2&&lead<c.base*2&&c.l===2&&Math.random()<smart*.3?"close":false;
 return c.l===2&&Math.random()<smart*.08?"mid":false}
function valueFor(c,team){if(!c)return 0;if(c.kind==="whoami")return Math.max(6,16-(c.clue||1));if(c.kind!=="q")return 15;return c.base*(c.hint?.5:1)*(c.doubled?2:1)}

function aiColor(){const h=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16)),d=(a,b)=>{const p=h(a),q=h(b);return Math.hypot(p[0]-q[0],p[1]-q[1],p[2]-q[2])};if(d(AI.color,ST.color)>140)return AI.color;return["#ff6b6b","#f2b705","#51cf66","#9775fa"].find(c=>d(c,ST.color)>140)}
function newGame(pvp){AI=AIL[ST.lvl];SIM=buildSim();stat(pvp?"start_pvp":"start_"+ST.tier+(ST.short?"_s":""));const op=pvp?NET.peer:null;G={tok:1,phase:"board",turn:Math.random()<.5?0:1,used:{},cur:null,aiFav:Math.floor(Math.random()*7),pvp:!!pvp,tier:ST.tier,gid:Date.now(),short:!!ST.short,teams:[{name:ST.name||"אני",color:ST.color,score:0,dbl:false,lvl:0},pvp?{name:op.name||"חבר",color:pvColor(op.color),score:0,dbl:false,lvl:0}:{name:AI.short,color:aiColor(),score:0,dbl:false,lvl:0}]};
 if(G.short){const keep=[0,1,2,3,4,5,6].sort(()=>Math.random()-.5).slice(0,4),km=rnd(MISS.length);for(let ci=0;ci<7;ci++)if(!keep.includes(ci))for(let l=0;l<3;l++)G.used[`c${ci}-${l}`]={x:1};MISS.forEach((_,i)=>{if(i!==km)G.used["m"+i]={x:1}});G.aiFav=keep[rnd(4)]}
 if(pvp){NET.lastState="";R("sim").set(JSON.stringify({qs:SIM.qs,whoami:SIM.whoami,quote:SIM.quote}))}
 courtSig="";$("#app").classList.add("ingame");render();SFX.horn();setTimeout(()=>SFX.cheer(2,.6),300);toast(G.turn===0?"🪙 הטלת מטבע: אתה מתחיל!":`🪙 הטלת מטבע: ${G.teams[1].name} מתחיל`,G.teams[G.turn].color,2600);if(G.turn===1&&!G.pvp)aiTurn()}
function next(){if(NET.role==="guest"){R("cmds").push(JSON.stringify({t:"next"}));return}if(!G||G.phase!=="shot")return;G.tok++;closeInput();G.cur=null;sceneOff();const done=Object.keys(G.used).length>=21+MISS.length;if(done)return endGame();G.turn=1-G.turn;G.phase="board";render();
 if(G.unlock){const u=G.unlock;G.unlock=null;toast(`🔓 ${u.team===0?"פתחת":G.teams[1].name+" פתח"} את שאלות ה-${LEVELS[u.l].p}`,G.teams[u.team].color,2600)}
 if(G.turn===1&&!G.pvp)aiTurn()}
async function aiTurn(){const tok=G.tok;await sleep(1300);if(!alive(tok)||G.phase!=="board")return;
 const al=allowedLevel(1),opts=[];for(let l=0;l<=al;l++)for(let ci=0;ci<7;ci++){const k=`c${ci}-${l}`;if(!G.used[k])opts.push({k,l})}
 const ms=MISS.map((_,i)=>"m"+i).filter(k=>!G.used[k]);let key;const favK=`c${G.aiFav}-2`;
 if(!G.teams[1].dbl&&opts.some(o=>o.k===favK)&&cellsLeft()>8&&Math.random()<AI.dbl*.7)key=favK;
 else if(!G.teams[1].dbl&&cellsLeft()<=8&&aiLead()<0&&opts.some(o=>o.l===2)&&Math.random()<AI.dbl){const t=opts.filter(o=>o.l===2);key=t[rnd(t.length)].k}
 else if(ms.length&&(Math.random()<.16||!opts.length))key=ms[rnd(ms.length)];else{const maxL=Math.max(...opts.map(o=>o.l));const pool=Math.random()<AI.greedy?opts.filter(o=>o.l===maxL):opts;key=pool[rnd(pool.length)].k}
 const el=$("#cell-"+key);if(el){el.classList.add("aipick")}SFX.pick();await sleep(900);if(!alive(tok))return;pick(key,1)}

 if(m){const ci=+m[1],l=+m[2];if(l>allowedLevel(by)){SFX.lock();toast(`🔒 קודם צריך לצדוק בשאלה של ${LEVELS[l-1].p}`,"#c92a2a");return}
  const c={key,kind:"q",c:ci,l,base:LEVELS[l].p,doubled:false,hint:false,owner:by,who:by,stage:"main"};
  if(!G.teams[by].dbl){if(by===0){G.phase="dbl";const yes=await dblAsk(c);if(yes){c.doubled=true;G.teams[0].dbl=true}}else if(G.pvp){G.phase="dbl";render();const yes=await rAsk("dbl",{c});if(!G)return;if(yes){c.doubled=true;G.teams[1].dbl=true;toast(`🔥 ${G.teams[1].name} מכפיל!`,G.teams[1].color)}}else{const why=aiWantsDouble(c);if(why){c.doubled=true;G.teams[1].dbl=true;const N=G.teams[1].name;toast(why==="fav"?`🔥 ${N} מכפיל – זו הקטגוריה החזקה שלו!`:why==="behind"?`🔥 ${N} בפיגור ומכפיל – הכול או כלום!`:`🔥 ${N} מכפיל!`,G.teams[1].color)}}}
  startQ(c)}
 else{const mi=+key.slice(1);const c={key,kind:MISS[mi].id,owner:by,who:2,locked:[false,false],clue:1};if(c.kind==="played")c.pair=drawPair();startQ(c)}}

 if(c.kind==="q"){const q=curQ(c);if(q.t==="pp")playPP(c,tok);else if(q.t==="hl")playHL(c,tok);else playOpen(c,tok)}else playRace(c,tok)}

/* ---------- open & list ---------- */
async function playOpen(c,tok){const q=curQ(c),s=c.owner;
 let ok=(s===0||G.pvp)?await humanAns(c,q,"main",tok,s):await aiAns(c,q,"main",tok);if(!alive(tok))return;
 if(ok)return finish(s,valueFor(c,s),"make");
 const o=1-s;
 if(allowedLevel(o)<c.l){await missFlash(s,`${s===0?"טעית":"טעה"} – ול${o===0?"ך":"ו"} עוד אין שאלות ${LEVELS[c.l].p} פתוחות`,tok);if(!alive(tok))return;return finish(-1,0,"none",-1)}
 await missFlash(s,`${s===0?"טעית":G.teams[1].name+" טעה"} – עובר ${o===0?"אליך":"ל"+G.teams[1].name}!`,tok);if(!alive(tok))return;
 c.stage="steal";c.who=o;c.got=[];render();
 ok=(o===0||G.pvp)?await humanAns(c,q,"steal",tok,o):await aiAns(c,q,"steal",tok);if(!alive(tok))return;
 if(ok)return finish(o,valueFor(c,o),"make");return finish(-1,0,"miss",o)}
async function humanAns(c,q,stage,tok,who=0){if(who===0)aiSay(stage==="steal"?"🙃 נראה אותך":"…");
 if(q.t==="list")return humanList(c,q,stage,tok,who);
 const r=await askP(who,{sec:stage==="steal"?60:90,hint:stage==="main"&&!!q.h&&!c.hint,pass:true});if(!alive(tok))return false;
 if(!r.text){toast(r.timeout?"⏱️ נגמר הזמן":who===0?"🤷 ויתרת":`🤷 ${G.teams[who].name} ויתר`,"#555");return false}
 if(okQ(r.text,q)){SFX.ping();return true}

function localDB(){const bc=new BroadcastChannel("nba-net");let data={};const L=[];

  update(v){Object.keys(v).forEach(k=>api.ref(p+"/"+k).set(v[k]));return Promise.resolve()},remove(){return this.set(null)},
  push(v){return api.ref(p+"/"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)).set(v)},

function dNum(d){const a=new Date(DAILY_EPOCH+"T12:00:00"),b=new Date(d+"T12:00:00");return Math.round((b-a)/864e5)+1}
function dRng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}

function dPool(tier,lv){const o=[];(SETS[tier]||[]).forEach(s=>s.qs.forEach(r=>{const x=r[lv];if(x&&x.t==="open"){const op=optsOf(x.h);if(op&&op.length===4&&op.some(z=>norm(z)===norm(x.a))&&!/הקודמת|הבאה|השנה|העונה הזו|כרגע/.test(x.q))o.push(x)}}));return o}

 plan.forEach(([t,l],k)=>{const P=dPool(t,l);if(!P.length)return;const pr=dRng("nba-slot-"+k),perm=P.map((_,i)=>i);for(let i=perm.length-1;i>0;i--){const j=Math.floor(pr()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]]}
  for(let off=0;off<P.length;off++){const x=P[perm[(n+off)%P.length]];if(used.has(norm(x.a)))continue;used.add(norm(x.a));const op=optsOf(x.h).slice();for(let i=op.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[op[i],op[j]]=[op[j],op[i]]}out.push({q:x.q,a:op.find(z=>norm(z)===norm(x.a)),opts:op,t});break}});return out}
